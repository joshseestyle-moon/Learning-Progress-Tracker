<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>學習管理系統</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="picker-page">
  <div>
    <h1>選擇你的帳號</h1>
    <p id="picker-hint" style="text-align:center;margin-top:.5rem">點選你的名字進入系統</p>
  </div>

  <div id="profiles-grid" class="profiles-grid"></div>

  <div style="display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;justify-content:center;">
    <button class="add-profile-btn" onclick="openAddModal()">+ 新增使用者</button>
    <button class="theme-toggle" id="edit-toggle-btn" onclick="toggleEditMode()">✏️ 編輯帳號</button>
    <button class="theme-toggle" onclick="backupData()">💾 備份資料</button>
    <button class="theme-toggle" onclick="triggerImport()">📂 匯入備份</button>
    <button class="theme-toggle" onclick="toggleTheme()">🌙 切換主題</button>
  </div>
  <input type="file" id="import-input" accept=".db" style="display:none" onchange="importData(this)">
</div>

<!-- Add user modal -->
<div id="add-modal" class="modal-overlay hidden">
  <div class="modal-box">
    <div class="modal-title">新增使用者</div>
    <div class="form-group">
      <label class="form-label">姓名</label>
      <input id="new-name" class="form-input" placeholder="請輸入姓名" maxlength="20">
    </div>
    <div class="form-group">
      <label class="form-label">頭像顏色</label>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap;" id="color-picker"></div>
    </div>
    <div class="form-group" style="display:flex;align-items:center;gap:.5rem;">
      <input type="checkbox" id="is-admin" style="width:auto;">
      <label for="is-admin" class="form-label" style="margin:0;">設為管理員</label>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeAddModal()">取消</button>
      <button class="btn btn-primary" onclick="submitAddUser()">新增</button>
    </div>
  </div>
</div>

<script>
const COLORS = ['#6c8ebf','#e07b54','#6cbf6c','#b86cbf','#e0c054','#54b8e0','#bf6c7c','#7cbfb8'];
let selectedColor = COLORS[0];
let editMode = false;

function initColorPicker() {
  const el = document.getElementById('color-picker');
  el.innerHTML = COLORS.map(c => `
    <div onclick="selectColor('${c}')"
      style="width:32px;height:32px;border-radius:50%;background:${c};cursor:pointer;
             border:3px solid ${c === selectedColor ? '#fff' : 'transparent'};
             box-shadow:${c === selectedColor ? '0 0 0 2px var(--accent)' : 'none'};
             transition:.1s;flex-shrink:0;">
    </div>`).join('');
}
function selectColor(c) { selectedColor = c; initColorPicker(); }

async function loadProfiles() {
  const res = await fetch('/api/users');
  const users = await res.json();
  const grid = document.getElementById('profiles-grid');
  if (!users.length) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">👤</div><p>尚無使用者，請新增第一個帳號</p></div>';
    return;
  }
  grid.innerHTML = users.map(u => `
    <div class="profile-card" style="position:relative;" onclick="${editMode ? '' : `selectUser(${u.id}, '${escHtml(u.name)}')`}" data-id="${u.id}">
      ${editMode ? `
        <button onclick="deleteUser(event, ${u.id}, '${escHtml(u.name)}')"
          style="position:absolute;top:6px;right:6px;
                 width:24px;height:24px;border-radius:50%;
                 background:var(--danger);color:#fff;
                 font-size:.8rem;font-weight:700;
                 display:flex;align-items:center;justify-content:center;
                 border:none;cursor:pointer;z-index:1;">✕</button>` : ''}
      <div class="avatar" style="background:${u.avatar_color}">${u.name.charAt(0).toUpperCase()}</div>
      <span class="name">${escHtml(u.name)}</span>
      ${u.is_admin ? '<span style="font-size:.7rem;color:var(--accent)">管理員</span>' : ''}
      ${editMode ? '<span style="font-size:.7rem;color:var(--danger);">點卡片以外區域刪除</span>' : ''}
    </div>`).join('');
}

function selectUser(id, name) {
  if (editMode) return;
  localStorage.setItem('userId', id);
  localStorage.setItem('userName', name);
  location.href = '/app#dashboard';
}

function toggleEditMode() {
  editMode = !editMode;
  const btn = document.getElementById('edit-toggle-btn');
  const hint = document.getElementById('picker-hint');
  btn.textContent = editMode ? '✅ 完成編輯' : '✏️ 編輯帳號';
  btn.style.background = editMode ? 'var(--danger)' : '';
  btn.style.color = editMode ? '#fff' : '';
  hint.textContent = editMode ? '點選 ✕ 刪除帳號，點「完成編輯」退出' : '點選你的名字進入系統';
  loadProfiles();
}

async function deleteUser(event, id, name) {
  event.stopPropagation();
  if (!confirm(`確定刪除「${name}」的帳號？\n此帳號的所有資料（作業、考試、成績等）將一併刪除，無法復原。`)) return;
  await fetch('/api/users/' + id, { method: 'DELETE' });
  loadProfiles();
}

function openAddModal() {
  initColorPicker();
  document.getElementById('new-name').value = '';
  document.getElementById('is-admin').checked = false;
  document.getElementById('add-modal').classList.remove('hidden');
  setTimeout(() => document.getElementById('new-name').focus(), 50);
}
function closeAddModal() { document.getElementById('add-modal').classList.add('hidden'); }

async function submitAddUser() {
  const name = document.getElementById('new-name').value.trim();
  if (!name) return alert('請輸入姓名');
  const is_admin = document.getElementById('is-admin').checked ? 1 : 0;
  await fetch('/api/users', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, avatar_color: selectedColor, is_admin })
  });
  closeAddModal();
  loadProfiles();
}

function backupData() {
  const a = document.createElement('a');
  a.href = '/api/backup';
  a.click();
}

function triggerImport() {
  document.getElementById('import-input').value = '';
  document.getElementById('import-input').click();
}

async function importData(input) {
  const file = input.files[0];
  if (!file) return;
  if (!confirm(`確定要匯入「${file.name}」？\n匯入後所有現有資料將被覆蓋，此操作無法復原。`)) return;

  const buf = await file.arrayBuffer();
  try {
    const res = await fetch('/api/backup', {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream' },
      body: buf,
    });
    const data = await res.json();
    if (!res.ok) { alert('匯入失敗：' + data.error); return; }
    alert('匯入成功！資料已還原。');
    loadProfiles();
  } catch (e) {
    alert('匯入失敗：' + e.message);
  }
}

function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Init
document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'light');
loadProfiles();

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !document.getElementById('add-modal').classList.contains('hidden'))
    submitAddUser();
  if (e.key === 'Escape') {
    closeAddModal();
    if (editMode) { editMode = false; toggleEditMode(); }
  }
});
</script>
</body>
</html>
